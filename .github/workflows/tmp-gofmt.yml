name: Temporary Go format diagnosis
on:
  push:
    branches: [fix/go-format-main]
jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
      - name: Show gofmt diff
        run: gofmt -d internal/controller/controller_test.go
