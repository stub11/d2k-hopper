name: Hopper 3810 Entware EXT4 Lab

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hopper3810-entware-ext4-lab
  cancel-in-progress: true

jobs:
  entware-ext4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install MIPSEL QEMU and filesystem tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static e2fsprogs

      - name: Run Entware EXT4 lab
        run: sudo sh scripts/router-entware-lab.sh

      - name: ShellCheck
        run: shellcheck -s sh scripts/router-entware-lab.sh
