name: Upstream D2K Sync

on:
  schedule:
    - cron: '13 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-d2k-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Hopper project
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch upstream D2K branch
        run: |
          git remote add upstream https://github.com/necronicle/d2k.git
          git fetch --no-tags upstream feat/telegram-tunnel

      - name: Sync and adapt upstream changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh scripts/upstream-sync.sh
