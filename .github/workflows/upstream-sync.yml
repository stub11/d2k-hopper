name: Upstream D2K Sync

on:
  schedule:
    # Hourly; minute 13 avoids the top-of-hour Actions load spike.
    - cron: '13 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-d2k-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Hopper project
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch upstream D2K branch
        run: |
          git remote add upstream https://github.com/necronicle/d2k.git
          git fetch --no-tags upstream feat/telegram-tunnel

      - name: Detect upstream changes
        id: detect
        shell: bash
        run: |
          set -euo pipefail
          latest="$(git rev-parse upstream/feat/telegram-tunnel)"
          state_file=".github/upstream-sync-state"
          state="$(tr -d '[:space:]' < "$state_file" 2>/dev/null || true)"
          if [[ -z "$state" ]]; then
            state="$(git rev-parse upstream/feat/telegram-tunnel~1)"
          fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          if [[ "$latest" == "$state" ]]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'changed=true' >> "$GITHUB_OUTPUT"
          git log --reverse --oneline "$state..upstream/feat/telegram-tunnel"

      - name: Classify upstream changes
        id: classify
        if: steps.detect.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          state="${{ steps.detect.outputs.state }}"
          latest="${{ steps.detect.outputs.latest }}"
          unhandled=""
          while read -r commit subject; do
            case "$subject" in
              'fix(mips): accept positive pipe success on MIPS'*)
                echo "SAFE: $commit $subject"
                ;;
              *)
                echo "UNHANDLED: $commit $subject"
                unhandled+="$commit $subject"$'\n'
                ;;
            esac
          done < <(git log --reverse --format='%H %s' "$state..$latest")

          if [[ -z "$unhandled" ]]; then
            echo 'has_unhandled=false' >> "$GITHUB_OUTPUT"
          else
            echo 'has_unhandled=true' >> "$GITHUB_OUTPUT"
            {
              echo 'unhandled<<EOF'
              printf '%s' "$unhandled"
              echo
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Apply known-safe adapters
        if: steps.detect.outputs.changed == 'true' && steps.classify.outputs.has_unhandled == 'false'
        shell: bash
        run: |
          set -euo pipefail
          state="${{ steps.detect.outputs.state }}"
          latest="${{ steps.detect.outputs.latest }}"
          while read -r commit subject; do
            case "$subject" in
              'fix(mips): accept positive pipe success on MIPS'*)
                sh scripts/upstream-adapt-mips-pipe.sh
                ;;
            esac
          done < <(git log --reverse --format='%H %s' "$state..$latest")

      - name: Verify adapted tree
        if: steps.detect.outputs.changed == 'true' && steps.classify.outputs.has_unhandled == 'false'
        run: sh scripts/check.sh

      - name: Commit safe adaptation and state
        if: steps.detect.outputs.changed == 'true' && steps.classify.outputs.has_unhandled == 'false'
        shell: bash
        run: |
          set -euo pipefail
          latest="${{ steps.detect.outputs.latest }}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if ! git diff --quiet; then
            git add -A
            git commit -m "sync(upstream): adapt D2K $latest for Hopper"
            git push origin HEAD:main
          fi

          printf '%s\n' "$latest" > .github/upstream-sync-state
          git add .github/upstream-sync-state
          if ! git diff --cached --quiet; then
            git commit -m "chore(sync): record upstream D2K revision $latest"
            git push origin HEAD:main
          fi

      - name: Report unhandled upstream changes
        if: steps.detect.outputs.changed == 'true' && steps.classify.outputs.has_unhandled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest="${{ steps.detect.outputs.latest }}"
          state="${{ steps.detect.outputs.state }}"
          title="Upstream D2K changes need Hopper adaptation: $latest"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number' || true)"

          if [[ -n "$existing" ]]; then
            echo "Open tracking issue already exists: #$existing"
            exit 0
          fi

          unhandled="$(git log --reverse --format='%H %s' "$state..$latest" | grep -v '^.* fix(mips): accept positive pipe success on MIPS' || true)"

          gh issue create             --title "$title"             --body "Upstream branch: https://github.com/necronicle/d2k/tree/feat/telegram-tunnel

Latest revision: $latest
Last acknowledged Hopper revision: $state

Unhandled changes:
$unhandled

The sync is fail-closed. Hopper will not advance the acknowledged upstream state or copy unreviewed code into main until a targeted adapter is added and scripts/check.sh passes."

      - name: Stop until an adapter exists
        if: steps.detect.outputs.changed == 'true' && steps.classify.outputs.has_unhandled == 'true'
        run: |
          echo "Upstream changed but at least one commit has no verified Hopper adapter."
          echo "No upstream state was advanced."
          exit 1
