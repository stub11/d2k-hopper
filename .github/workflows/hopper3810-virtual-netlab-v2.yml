name: Hopper 3810 Virtual Network Fault Lab v2
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hopper3810-virtual-netlab-v2
  cancel-in-progress: true
jobs:
  fault-matrix-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install QEMU and network tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mipsel-linux-gnu qemu-user-static curl iproute2
      - name: Run isolated DNS and fault matrix
        run: sudo sh scripts/router-netlab-faults-v2.sh
      - name: ShellCheck
        run: shellcheck -s sh scripts/router-netlab-faults-v2.sh
